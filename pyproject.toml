[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swayamml"
version = "0.2.1"
description = "Multi-agent ML pipeline — automated machine learning with LangGraph + LLMs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "AgenticML Contributors"},
]
keywords = ["machine-learning", "automl", "agents", "langgraph", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langgraph",
    "langchain-openai",
    "langchain-core",
    "openai",
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "joblib",
    "openpyxl",
    "python-dotenv",
    "imbalanced-learn",
    "streamlit",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic"]
google = ["langchain-google-genai"]
boost = ["xgboost", "lightgbm"]
all = [
    "langchain-anthropic",
    "langchain-google-genai",
    "xgboost",
    "lightgbm",
]
dev = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
agenticml = "agenticml.ml.main:main"

[project.urls]
Homepage = "https://github.com/VedavrathP/AgenticML"
Repository = "https://github.com/VedavrathP/AgenticML"

[tool.setuptools.packages.find]
include = ["agenticml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
